name: Daily Thread social queue

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-social.yml"
      - "social-automation/**"
      - "src/new-rounds.js"
  schedule:
    - cron: "17 6 * * *"
      timezone: "Europe/London"
    - cron: "37 11 * * *"
      timezone: "Europe/London"
    - cron: "37 16 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

concurrency:
  group: daily-thread-social-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  maintain-buffer-queue:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: social-automation/package-lock.json

      - name: Install renderer
        working-directory: social-automation
        run: |
          npm ci
          npx playwright install chromium

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Verify video tooling
        run: ffmpeg -version

      - name: Verify schedule logic
        run: npm test --prefix social-automation

      - name: Render the rolling five-day Instagram and TikTok media package
        run: node social-automation/cli.mjs render --days 5 --output docs/social

      - name: Publish immutable media files
        run: |
          git config user.name "daily-thread-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/social
          if ! git diff --cached --quiet; then
            git commit -m "chore: render Daily Thread social queue"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fill both Buffer queues and verify today
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          node social-automation/cli.mjs schedule \
            --days 5 \
            --queue-size 8 \
            --recover-instagram-carousel 2026-08-11 \
            --delete-tiktok-failures-before 2026-08-11 \
            --late-delay-minutes 60 \
            --output docs/social \
            --media-root https://raw.githubusercontent.com/I-think-we-struck-goals-here/thread-game/main/docs/social
          node social-automation/cli.mjs audit
