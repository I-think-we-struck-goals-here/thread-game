<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Thread Countdown Reel</title>
  <style>
    @font-face { font-family: "Cormorant Garamond"; src: url("./fonts/CormorantGaramond-Light.ttf") format("truetype"); font-weight: 300; }
    @font-face { font-family: "Cormorant Garamond"; src: url("./fonts/CormorantGaramond-Regular.ttf") format("truetype"); font-weight: 400; }
    @font-face { font-family: "Cormorant Garamond"; src: url("./fonts/CormorantGaramond-Medium.ttf") format("truetype"); font-weight: 500; }
    @font-face { font-family: "Cormorant Garamond"; src: url("./fonts/CormorantGaramond-SemiBold.ttf") format("truetype"); font-weight: 600; }
    @font-face { font-family: "Cormorant Garamond"; src: url("./fonts/CormorantGaramond-Bold.ttf") format("truetype"); font-weight: 700; }
    @font-face { font-family: "DM Sans"; src: url("./fonts/DMSans-Regular.ttf") format("truetype"); font-weight: 400; }
    @font-face { font-family: "DM Sans"; src: url("./fonts/DMSans-Medium.ttf") format("truetype"); font-weight: 500; }
    @font-face { font-family: "DM Sans"; src: url("./fonts/DMSans-SemiBold.ttf") format("truetype"); font-weight: 600; }
    @font-face { font-family: "DM Sans"; src: url("./fonts/DMSans-Bold.ttf") format("truetype"); font-weight: 700; }

    :root {
      --paper: #f8f5ef;
      --ink: #171512;
      --muted: #887f74;
      --track: #e3ded6;
      --green: #2f7546;
      --sans: "DM Sans", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: "Cormorant Garamond", Georgia, serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: var(--paper); }
    body { color: var(--ink); font-family: var(--sans); }

    .reel-stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,.42), transparent 34%),
        var(--paper);
      isolation: isolate;
    }

    .hook,
    .result-list,
    .timer,
    .result-question,
    .result-cta {
      position: absolute;
      left: 150px;
      width: 780px;
      text-align: center;
    }

    .hook {
      top: 365px;
      margin: 0;
      color: var(--muted);
      font-size: 34px;
      font-weight: 500;
      letter-spacing: 3px;
      line-height: 1.28;
      text-transform: uppercase;
      transform: translateX(2.5px);
    }

    .main-hook {
      font-size: 33px;
      letter-spacing: 4.8px;
      text-align: left;
    }

    .result-list {
      top: 520px;
      left: 50%;
      width: max-content;
      translate: -50% 0;
      display: grid;
      gap: 28px;
      opacity: 1;
      text-align: left;
    }

    .result-row {
      font-family: var(--serif);
      font-size: 76px;
      font-weight: 400;
      letter-spacing: .005em;
      line-height: 1;
      white-space: nowrap;
    }

    .result-connection {
      display: inline;
      white-space: nowrap;
    }

    .result-answer-fragment {
      --answer-line-opacity: 1;
      position: relative;
      display: inline-block;
      vertical-align: baseline;
    }

    .mode-join .result-answer-fragment::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: .08em;
      left: 0;
      height: 3px;
      border-radius: 99px;
      background: var(--green);
      opacity: var(--answer-line-opacity);
    }

    .result-answer-word {
      display: inline-block;
      color: var(--green);
      vertical-align: baseline;
      will-change: clip-path, color;
    }

    .result-connection .clue-fragment {
      position: relative;
      display: inline-block;
      color: var(--ink);
      font-weight: 600;
    }

    .phrase-list {
      position: absolute;
      top: 500px;
      left: 190px;
      display: none;
      width: 700px;
      gap: 24px;
    }

    .mode-phrase .phrase-list { display: grid; }
    .mode-phrase .result-list { display: none; }

    .phrase-result-row {
      min-height: 104px;
      opacity: 0;
    }

    .phrase-clue {
      margin: 0;
      font: 600 64px/.92 var(--serif);
      letter-spacing: .005em;
    }

    .phrase-resolution {
      width: max-content;
      margin-top: 10px;
      color: #716a62;
      font: 400 27px/1.2 var(--sans);
      white-space: nowrap;
      opacity: 0;
      transform: translateY(7px);
    }

    .phrase-resolution .answer-token {
      color: var(--green);
      font-weight: 600;
    }

    .phrase-answer {
      position: absolute;
      top: 1215px;
      left: 150px;
      display: none;
      width: 780px;
      margin: 0;
      color: var(--green);
      text-align: center;
      font: 400 96px/1 var(--serif);
      letter-spacing: .03em;
      opacity: 0;
      transform: translateY(10px) scale(.985);
    }

    .mode-phrase .phrase-answer { display: block; }

    .phrase {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 130px;
      margin: 0;
      font-family: var(--serif);
      font-size: 82px;
      font-weight: 400;
      letter-spacing: .01em;
      line-height: 1;
      opacity: 0;
      transform: translateY(8px);
      will-change: opacity, transform;
    }

    .phrase-unit {
      display: inline-flex;
      align-items: baseline;
      width: auto;
      white-space: nowrap;
    }

    .phrase-left,
    .phrase-right { flex: 0 0 auto; }

    .answer-after .phrase-right,
    .answer-before .phrase-left { display: none; }

    .answer-slot {
      position: relative;
      display: inline-block;
      flex: 0 0 var(--answer-width, 205px);
      width: var(--answer-width, 205px);
      height: 1em;
      color: var(--ink);
    }

    .answer-after.has-space .answer-slot { margin-left: var(--space-width, 20px); }
    .answer-before.has-space .answer-slot { margin-right: var(--space-width, 20px); }

    .answer-line {
      position: absolute;
      bottom: .08em;
      left: var(--answer-ink-left, 0);
      width: var(--answer-ink-width, 190px);
      height: 3px;
      border-radius: 99px;
      background: var(--green);
      transform-origin: center;
    }

    .answer-word {
      position: absolute;
      inset: 0;
      display: block;
      opacity: 0;
      overflow: hidden;
      color: var(--ink);
      clip-path: inset(0 100% 0 0);
    }

    .timer {
      top: 1220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .countdown-ring {
      --progress: 1;
      position: relative;
      display: grid;
      place-items: center;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: conic-gradient(var(--green) calc(var(--progress) * 1turn), var(--track) 0);
      transform: rotate(-90deg);
    }

    .countdown-ring::before {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: var(--paper);
    }

    .countdown-number {
      position: relative;
      z-index: 1;
      color: var(--ink);
      font-size: 40px;
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1;
      transform: rotate(90deg);
    }

    .timer-label {
      color: var(--muted);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 3px;
      line-height: 1;
      text-transform: uppercase;
    }

    .result-question {
      top: 1350px;
      margin: 0;
      color: #4d4943;
      font-size: 36px;
      font-weight: 500;
      line-height: 1.3;
      opacity: 0;
    }

    .result-cta {
      top: 1422px;
      color: var(--muted);
      font-size: 27px;
      font-weight: 600;
      letter-spacing: .4px;
      line-height: 1.2;
      opacity: 0;
    }

    .safe-guides {
      position: absolute;
      z-index: 20;
      top: 285px;
      left: 72px;
      display: none;
      width: 778px;
      height: 1225px;
      border: 3px solid rgba(220, 42, 42, .8);
      background: rgba(220, 42, 42, .035);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="reel-stage" id="reelStage">
    <h1 class="hook main-hook" id="mainHook">Find the connection</h1>

    <div class="result-list" id="resultList"></div>
    <div class="phrase-list" id="phraseList"></div>
    <p class="phrase-answer" id="phraseAnswer"></p>

    <div class="timer" id="timer">
      <div class="countdown-ring" id="countdownRing">
        <span class="countdown-number" id="countdownNumber">5</span>
      </div>
      <div class="timer-label" id="timerLabel">Next word</div>
    </div>

    <p class="result-question" id="resultQuestion">How many clues did you need?</p>
    <div class="result-cta" id="resultCta">Play today’s Thread · link in bio</div>
    <div class="safe-guides" id="safeGuides"></div>
  </main>

  <script>
    const clamp = value => Math.min(1, Math.max(0, value));
    const smooth = value => {
      const x = clamp(value);
      return x * x * (3 - 2 * x);
    };
    const between = (time, start, end) => smooth((time - start) / (end - start));
    const setStyle = (element, styles) => Object.assign(element.style, styles);

    const reelStage = document.querySelector('#reelStage');
    const mainHook = document.querySelector('#mainHook');
    const timer = document.querySelector('#timer');
    const timerLabel = document.querySelector('#timerLabel');
    const countdownRing = document.querySelector('#countdownRing');
    const countdownNumber = document.querySelector('#countdownNumber');
    const resultQuestion = document.querySelector('#resultQuestion');
    const resultCta = document.querySelector('#resultCta');
    const resultList = document.querySelector('#resultList');
    const phraseList = document.querySelector('#phraseList');
    const phraseAnswer = document.querySelector('#phraseAnswer');
    let reelMode = 'join';

    function alignHookWithClues() {
      const activeList = reelMode === 'phrase' ? phraseList : resultList;
      const bounds = activeList.getBoundingClientRect();
      mainHook.style.left = `${Math.round(bounds.left)}px`;
      mainHook.style.width = `${Math.round(bounds.width)}px`;
      mainHook.style.transform = 'none';
    }

    function fitRoundToSafeArea() {
      if (reelMode === 'join') {
        const rows = [...resultList.children];
        rows.forEach(row => { row.style.fontSize = '76px'; });
        const widest = Math.max(...rows.map(row => row.querySelector('.result-connection').getBoundingClientRect().width));
        const fittedSize = Math.max(54, Math.min(76, 76 * 778 / widest));
        rows.forEach(row => { row.style.fontSize = `${fittedSize}px`; });
        return;
      }

      const rows = [...phraseList.children];
      const clues = rows.map(row => row.querySelector('.phrase-clue'));
      clues.forEach(clue => { clue.style.fontSize = '64px'; });
      const widestClue = Math.max(...clues.map(clue => clue.getBoundingClientRect().width));
      const clueSize = Math.max(48, Math.min(64, 64 * 700 / widestClue));
      clues.forEach(clue => { clue.style.fontSize = `${clueSize}px`; });

      const resolutions = rows.map(row => row.querySelector('.phrase-resolution'));
      resolutions.forEach(resolution => { resolution.style.fontSize = '27px'; });
      const widestResolution = Math.max(...resolutions.map(resolution => resolution.getBoundingClientRect().width));
      const resolutionSize = Math.max(20, Math.min(27, 27 * 700 / widestResolution));
      resolutions.forEach(resolution => { resolution.style.fontSize = `${resolutionSize}px`; });
    }

    function resultElement(clue, answer) {
      const row = document.createElement('div');
      row.className = 'result-row';
      const connection = clue.connection.toUpperCase();
      const clueWord = clue.word.toUpperCase();
      const answerWord = answer.toUpperCase();
      const clueIndex = connection.indexOf(clueWord);
      const answerIndex = connection.indexOf(answerWord);
      if (clueIndex === -1) throw new Error(`${clueWord} is not present in ${connection}.`);
      if (answerIndex === -1) throw new Error(`${answerWord} is not present in ${connection}.`);
      const connectionElement = document.createElement('span');
      connectionElement.className = 'result-connection';

      const ranges = [
        { start: clueIndex, end: clueIndex + clueWord.length, className: 'clue-fragment' },
        { start: answerIndex, end: answerIndex + answerWord.length, className: 'result-answer-fragment' },
      ].sort((a, b) => a.start - b.start);
      let cursor = 0;
      ranges.forEach(range => {
        if (range.start > cursor) connectionElement.append(connection.slice(cursor, range.start));
        const fragment = document.createElement('span');
        fragment.className = range.className;
        if (range.className === 'result-answer-fragment') {
          fragment.dataset.direction = answerIndex < clueIndex ? 'before' : 'after';
          const word = document.createElement('span');
          word.className = 'result-answer-word';
          word.textContent = connection.slice(range.start, range.end);
          fragment.append(word);
        } else {
          fragment.textContent = connection.slice(range.start, range.end);
        }
        connectionElement.append(fragment);
        cursor = range.end;
      });
      if (cursor < connection.length) connectionElement.append(connection.slice(cursor));
      row.append(connectionElement);
      return row;
    }

    function phraseResultElement(clue) {
      const row = document.createElement('div');
      row.className = 'phrase-result-row';
      const heading = document.createElement('p');
      heading.className = 'phrase-clue';
      heading.textContent = clue.word.toUpperCase();
      const resolution = document.createElement('div');
      resolution.className = 'phrase-resolution';
      const connection = clue.connection;
      const highlight = clue.highlight;
      const index = connection.toLocaleUpperCase().indexOf(highlight.toLocaleUpperCase());
      if (index === -1) throw new Error(`${highlight} is not present in ${connection}.`);
      resolution.append(connection.slice(0, index));
      const answer = document.createElement('span');
      answer.className = 'answer-token';
      answer.textContent = connection.slice(index, index + highlight.length);
      resolution.append(answer, connection.slice(index + highlight.length));
      row.append(heading, resolution);
      return row;
    }

    function setResultAnswerReveal(row, amount, settle) {
      const fragment = row.querySelector('.result-answer-fragment');
      const word = row.querySelector('.result-answer-word');
      const hidden = Math.round((1 - amount) * 1000) / 10;
      const clipPath = fragment.dataset.direction === 'before'
        ? `inset(0 0 0 ${hidden}%)`
        : `inset(0 ${hidden}% 0 0)`;
      const green = [47, 117, 70];
      const ink = [23, 21, 18];
      const channel = index => Math.round(green[index] + (ink[index] - green[index]) * settle);
      setStyle(word, {
        clipPath,
        color: `rgb(${channel(0)}, ${channel(1)}, ${channel(2)})`,
      });
      fragment.style.setProperty('--answer-line-opacity', String(1 - amount));
    }

    window.setReelData = async data => {
      if (!data || !Array.isArray(data.clues) || data.clues.length !== 5) throw new Error('Reel requires five clues.');
      reelMode = data.mode === 'phrase' ? 'phrase' : 'join';
      await Promise.all([
        document.fonts.load('400 76px "Cormorant Garamond"'),
        document.fonts.load('600 76px "Cormorant Garamond"'),
        document.fonts.load('400 96px "Cormorant Garamond"'),
        document.fonts.load('600 64px "Cormorant Garamond"'),
        document.fonts.load('500 34px "DM Sans"'),
        document.fonts.load('400 27px "DM Sans"'),
        document.fonts.load('600 27px "DM Sans"'),
      ]);
      const answer = data.answer.toUpperCase();
      resultQuestion.textContent = data.question || 'How many clues did you need?';
      resultCta.textContent = data.cta || 'Play today’s Thread · link in bio';
      reelStage.classList.remove('mode-join', 'mode-phrase');
      reelStage.classList.add(`mode-${reelMode}`);
      resultList.replaceChildren();
      phraseList.replaceChildren();
      phraseAnswer.textContent = answer;
      if (reelMode === 'phrase') {
        phraseList.replaceChildren(...data.clues.map(phraseResultElement));
      } else {
        resultList.replaceChildren(...data.clues.map(clue => resultElement(clue, answer)));
      }
      fitRoundToSafeArea();
      alignHookWithClues();
      window.renderFrame(0);
    };

    window.renderFrame = rawTime => {
      const time = Math.max(0, rawTime);
      const revealStarts = [0, 5, 10, 15, 20];

      const activeRows = reelMode === 'phrase' ? [...phraseList.children] : [...resultList.children];
      activeRows.forEach((row, index) => {
        const show = index === 0 ? between(time, 0, .25) : between(time, revealStarts[index], revealStarts[index] + .28);
        row.style.opacity = String(show);
      });

      const cycleTime = Math.min(4.999, Math.max(0, time % 5));
      const remaining = Math.max(1, Math.ceil(5 - cycleTime));
      countdownNumber.textContent = String(remaining);
      countdownRing.style.setProperty('--progress', String(1 - cycleTime / 5));
      timerLabel.textContent = time < 5
        ? 'Next word'
        : time < 20
          ? 'Solved? Remember your clue number'
          : 'Your final guess';

      mainHook.style.opacity = '1';
      timer.style.opacity = String(1 - between(time, 24.7, 24.92));
      if (reelMode === 'phrase') {
        const answerReveal = between(time, 25, 25.42);
        phraseAnswer.style.opacity = String(answerReveal);
        phraseAnswer.style.transform = `translateY(${10 * (1 - answerReveal)}px) scale(${.985 + .015 * answerReveal})`;
        [...phraseList.children].forEach((row, index) => {
          const reveal = between(time, 25.38 + index * .1, 25.74 + index * .1);
          const resolution = row.querySelector('.phrase-resolution');
          resolution.style.opacity = String(reveal);
          resolution.style.transform = `translateY(${7 * (1 - reveal)}px)`;
        });
      } else {
        phraseAnswer.style.opacity = '0';
        [...resultList.children].forEach((row, index) => {
          const start = 25 + index * .1;
          setResultAnswerReveal(
            row,
            between(time, start, start + .46),
            between(time, 25.82, 26.04),
          );
        });
      }
      resultQuestion.style.opacity = String(between(time, 26.45, 26.69));
      resultCta.style.opacity = String(between(time, 26.8, 27.06));
    };

    window.showSafeGuides = show => {
      document.querySelector('#safeGuides').style.display = show ? 'block' : 'none';
    };
  </script>
</body>
</html>
